name: Feature
description: 提议 MTX Data Platform 的功能或模块
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 涉及的模块、是否引入新的调度或存储依赖。
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: 与技术基线的关系
      description: 说明是否仍使用 JDK 25、Spring Boot、MyBatis-Plus、Doris、Kafka、Quartz 和 JUnit 5。若建议偏离基线，单独开决策而不是在本需求中替换。
    validations:
      required: true
