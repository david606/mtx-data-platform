name: Bug
description: 报告 MTX Data Platform 的缺陷
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: 现象
      description: 实际行为是什么。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
      description: 正确行为应该是什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 分支、模块、命令和输入。不要粘贴密钥、令牌或密码。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 0.1.0-SNAPSHOT / commit sha
    validations:
      required: true
