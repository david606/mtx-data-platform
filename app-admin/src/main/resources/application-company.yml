# 公司开发环境地址。账号和密码只来自环境变量，不写在本文件。
mtx:
  rdp:
    dev:
      placement: COMPANY
      scope: DEV_ONLY
      mysql:
        host: 192.168.1.50
        port: 3306
        database: mtx_rdp_dev_only
        username: ${MTX_RDP_DEV_MYSQL_USER}
        password: ${MTX_RDP_DEV_MYSQL_PASSWORD}
        connect-timeout: 5s
        pool:
          maximum-size: 2
          minimum-idle: 0
      kafka:
        bootstrap-servers: 192.168.1.51:9092
        consumer-group: ""
        security-protocol: PLAINTEXT
        producer:
          acks: all
        consumer:
          enable-auto-commit: false
      doris:
        fe-sql-host: 192.168.1.50
        fe-sql-port: 9030
        fe-http-host: 192.168.1.50
        fe-http-port: 8030
        be-allowlist: 192.168.1.50:8040,192.168.1.51:8040
        database: mtx_rdp_dev_only
        username: ${MTX_RDP_DEV_DORIS_USER}
        password: ${MTX_RDP_DEV_DORIS_PASSWORD}
        stream-load-timeout: 30s
